<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
    <head>
        <meta charset="UTF-8">
        <title th:text="${status + ' - ' + error}">Error</title>
        <link rel="stylesheet" th:href="@{/css/styles.css}">
    </head>
    <body>
        <div class="container error-generic">
            <h1 th:text="${status + ' – ' + error}">Error</h1>
            <p th:text="${message}">Something went wrong.</p>
            <a class="back-link" th:href="@{/profiles}">Back</a>
        </div>
    </body>
</html>
